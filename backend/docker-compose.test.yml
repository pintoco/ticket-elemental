# Base de datos efímera para tests e2e: `npm run test:e2e:db`
services:
  postgres-test:
    image: postgres:15-alpine
    container_name: ticket_postgres_test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ticket_test
    ports:
      - '127.0.0.1:5440:5432'
    tmpfs:
      - /var/lib/postgresql/data
